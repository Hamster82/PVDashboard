name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests und APK bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/release/app-release.apk PVDashboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PVDashboard
          path: PVDashboard.apk

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PV Dashboard 1.0.${{ github.run_number }}
          body: "APK herunterladen: **PVDashboard.apk** (unten unter Assets) auf dem Handy öffnen und installieren."
          files: PVDashboard.apk
          make_latest: true
